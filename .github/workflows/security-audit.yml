name: Repository security checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan reachable Git history for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download checksum-pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/budget-security-tools"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$RUNNER_TEMP/budget-security-tools/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$RUNNER_TEMP/budget-security-tools/gitleaks.tar.gz" | sha256sum --check --status
          tar --extract --gzip --file "$RUNNER_TEMP/budget-security-tools/gitleaks.tar.gz" \
            --directory "$RUNNER_TEMP/budget-security-tools" --no-same-owner gitleaks
      - name: Scan without exposing matched values in logs or artifacts
        shell: bash
        run: |
          set -euo pipefail
          if ! "$RUNNER_TEMP/budget-security-tools/gitleaks" git --redact=100 \
            --no-banner --log-opts=--all >"$RUNNER_TEMP/budget-secret-scan.log" 2>&1; then
            printf 'Secret scan failed. Review the repository privately; scanner diagnostics and matched values were withheld.\n' >&2
            exit 1
          fi
          printf 'No potential secrets detected in reachable Git history.\n'

  dependencies:
    name: Audit runtime and build dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify action pins and known dependency advisories
        run: |
          python3 Verification/check-deployment-workflows.py
          python3 Verification/test-codeql-results.py
          npm audit --prefix api --audit-level=low
          npm audit --prefix web --audit-level=low
          npm audit --prefix shared --audit-level=low

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize CodeQL
        uses: github/codeql-action/init@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze repository source
        uses: github/codeql-action/analyze@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4
        with:
          category: '/language:${{ matrix.language }}'
          output: ${{ runner.temp }}/budget-codeql-results
          # Preserve any existing default CodeQL setup; this job is a read-only
          # additional check. Do not upload source databases or duplicate alerts.
          upload: never
          upload-database: false
      - name: Reject reported security findings
        run: python3 Verification/check-codeql-results.py "$RUNNER_TEMP/budget-codeql-results"
