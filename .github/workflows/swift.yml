# Verify the actual Foundation models/exporter in this source-only iPhone package.
# The repository has no Package.swift or Xcode project to build with swift build.

name: Swift

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: macos-latest
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v4
    - name: Verify budget models
      run: sh Verification/check-chart.sh
    - name: Verify Excel workbooks
      run: sh Verification/check-excel-export.sh
    - name: Type-check iPhone source
      run: |
        xcrun --sdk iphonesimulator swiftc -typecheck \
          -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" \
          -target arm64-apple-ios16.0-simulator -swift-version 5 \
          ContentView.swift ExcelExport.swift ExcelExportUI.swift SavingsBucketsUI.swift
