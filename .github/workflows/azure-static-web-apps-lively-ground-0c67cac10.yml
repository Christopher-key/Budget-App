name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
    paths: ['web/**', 'shared/**', '.github/workflows/azure-static-web-apps-lively-ground-0c67cac10.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Verify and deploy website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Reject known website runtime and build vulnerabilities
        run: npm audit --prefix web --audit-level=low
      - name: Install website dependencies
        run: npm ci --prefix web
      - name: Verify website security behavior
        run: npm test --prefix web
      - name: Build website
        run: npm run build --prefix web
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'https://simplebudget-q5q2a6ddopmq4.azurewebsites.net' }}
          VITE_SECURITY_STATUS_URL: ${{ vars.VITE_SECURITY_STATUS_URL || 'https://budget-security-77hl2mdzm5osq.azurewebsites.net/api/service/status' }}
      - name: Deploy prebuilt website
        id: deployment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LIVELY_GROUND_0C67CAC10 }}
          action: upload
          app_location: web/dist
          api_location: ''
          output_location: ''
          skip_app_build: true
      - name: Website address
        env:
          WEBSITE_URL: ${{ steps.deployment.outputs.static_web_app_url }}
        run: |
          if [ -n "$WEBSITE_URL" ]; then
            printf 'Website: %s\n' "$WEBSITE_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
