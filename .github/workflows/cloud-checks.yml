name: Cloud application checks

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['web/**', 'api/**', 'shared/**', 'infra/**', 'Verification/*cloud*', 'Verification/*lockdown*', 'Verification/test-api-publisher.py', '.github/workflows/cloud-checks.yml']
  pull_request:
    paths: ['web/**', 'api/**', 'shared/**', 'infra/**', 'Verification/*cloud*', 'Verification/*lockdown*', 'Verification/test-api-publisher.py', '.github/workflows/cloud-checks.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify Azure expiry and indexing compatibility
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --outfile "$RUNNER_TEMP/budget-template.json"
          python3 Verification/check-cloud-template.py "$RUNNER_TEMP/budget-template.json"
          az bicep build --file infra/lockdown-control.bicep --outfile "$RUNNER_TEMP/budget-lockdown.json"
          az bicep build --file infra/security-baseline.bicep --outfile "$RUNNER_TEMP/budget-baseline.json"
          python3 Verification/check-lockdown-template.py "$RUNNER_TEMP/budget-lockdown.json" "$RUNNER_TEMP/budget-baseline.json"
      - name: Financial models and Excel
        run: npm ci --prefix shared && npm run build --prefix shared && npm test --prefix shared
      - name: Verify safe API publication and retries
        run: |
          python3 Verification/test-api-publisher.py
          python3 Verification/test-lockdown-control.py
      - name: App accounts, encrypted sync, and passcode policy
        run: npm ci --prefix api && npm test --prefix api
      - name: Package deployable API
        run: ./infra/package-api.sh "$RUNNER_TEMP/budget-api.zip"
      - name: Keep API package for owner deployment
        uses: actions/upload-artifact@v4
        with:
          name: budget-api-package
          path: ${{ runner.temp }}/budget-api.zip
          retention-days: 3
          if-no-files-found: error
      - name: Website security and production build
        run: npm ci --prefix web && npm test --prefix web && npm run build --prefix web
      - name: Verify encrypted sync between browser and API
        run: ./web/node_modules/.bin/tsx --test Verification/cloud-integration.ts

  publish_api_build:
    name: Publish downloadable API build
    needs: verify
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: budget-api-package
          path: api-release
      - name: Publish the tested code package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd api-release
          sha256sum budget-api.zip > budget-api.zip.sha256
          build_tag="api-build-$SOURCE_SHA"
          if gh release view "$build_tag" >/dev/null 2>&1; then
            mkdir existing
            gh release download "$build_tag" --pattern budget-api.zip --dir existing
            cmp budget-api.zip existing/budget-api.zip
          else
            gh release create "$build_tag" budget-api.zip budget-api.zip.sha256 \
              --target "$SOURCE_SHA" --prerelease --latest=false \
              --title "API build ${SOURCE_SHA:0:12}" \
              --notes 'Verified application code and production dependencies only. No user records, passwords, server settings, or Azure credentials are included.'
          fi
